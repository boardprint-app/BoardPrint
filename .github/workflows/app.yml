# Instaladores de la app (plan §8): interfaz -> sidecar (PyInstaller) -> prueba de humo ->
# Tauri (setup.exe NSIS / .dmg). Solo a mano, cuando el usuario lo pide (Actions > App > Run
# workflow, o `gh workflow run App --ref <rama>`): cada instalador son ~200 MB de
# almacenamiento de Actions y minutos de Windows (x2), y se compila y se prueba en local
# (app/shell/README.md). macOS con la opción macos: en un repo privado sus minutos cuentan x10.
# La app no trae paquetes (PLAN_PAQUETES P11) y el Release tampoco: con «publicar» y una
# versión, el instalador sale en un Release de GitHub `v<versión>` (P77). Si el repo tiene
# `packs/`, sus .bppack salen como artefacto del run para probarlos, no en el Release.

name: App

on:
  workflow_dispatch:
    inputs:
      macos:
        description: "Compilar también para macOS"
        type: boolean
        default: false
      publicar:
        description: "Publicar un Release de GitHub con el instalador"
        type: boolean
        default: false
      version:
        description: "Versión del Release (p. ej. 0.1.0), si se publica"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Instalador (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.macos && '["windows-latest","macos-latest"]' || '["windows-latest"]') }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/shell/package-lock.json

      # Una sola fuente de versión (PLAN_V020 V12): la de la entrada, en todos los manifiestos.
      - name: Versión
        if: inputs.version != ''
        run: python scripts/set_version.py "${{ inputs.version }}"

      - name: Interfaz
        working-directory: app/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Con su interfaz ya compilada (npm run build la compila antes que la de la app). Sin
      # `packs/` (el repo público) no exporta nada.
      - name: Paquetes oficiales (.bppack)
        run: python app/shell/build_packs.py

      - name: Sidecar (backend empaquetado)
        run: |
          python -m pip install -r app/backend/requirements.txt pyinstaller
          python app/shell/build_sidecar.py

      # El Python standalone y uv del entorno de paquetes, como recursos (PLAN_PAQUETES P21).
      # Antes de la prueba de humo: los paquetes corren en su trabajador (P89).
      - name: Python y uv de los paquetes
        run: python app/shell/fetch_pyenv.py

      - name: Prueba de humo del sidecar
        run: python app/shell/smoke_sidecar.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/shell/src-tauri

      # Con la clave del actualizador (PLAN_V020 V11), `tauri build` firma cada instalador
      # (`<nombre>.sig`) para el `latest.json`. La clave vive en los secretos del repo.
      - name: Instalador (Tauri)
        working-directory: app/shell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm ci --no-audit --no-fund
          npx tauri build

      # Instala el setup.exe y prueba el entorno de paquetes en la app instalada: numpy con uv,
      # el trabajador y el criterio de fracaso de PLAN_PAQUETES §12 (FF 10.1 paso 1).
      - name: Prueba del entorno de paquetes (app instalada)
        if: runner.os == 'Windows'
        run: python app/shell/smoke_pack_env.py

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            app/shell/src-tauri/target/release/bundle/nsis/*.exe
            app/shell/src-tauri/target/release/bundle/nsis/*.exe.sig
            app/shell/src-tauri/target/release/bundle/dmg/*.dmg
            app/shell/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/shell/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: paquetes
          path: app/shell/dist-packs/*.bppack
          if-no-files-found: ignore
          retention-days: 3

  publicar:
    name: Release de GitHub
    needs: build
    if: inputs.publicar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Solo los instaladores: los .bppack (artefacto `paquetes`) no van al Release.
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: instalador-*
          merge-multiple: true
      # El actualizador busca el último Release y su latest.json (PLAN_V020 §4).
      - name: latest.json
        run: python3 scripts/latest_json.py release "${{ inputs.version }}"
      - name: Release v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "La versión tiene que ser X.Y.Z (es «$VERSION»)"; exit 1
          fi
          ls -l release
          # las notas, de docs/releases/v<versión>.md si existe (no está en el repo público, O20: se ponen luego con gh release edit)
          NOTES="docs/releases/v$VERSION.md"
          if [ ! -f "$NOTES" ]; then
            echo "BoardPrint installer. The app ships without packs: install one (a folder or a .bppack) from Settings, Packs." > /tmp/notes.md
            NOTES=/tmp/notes.md
          fi
          gh release create "v$VERSION" release/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "BoardPrint $VERSION" --notes-file "$NOTES"
