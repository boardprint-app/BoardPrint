name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not use this form: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: BoardPrint version
      description: The installer version (for example 0.1.0), or the commit if you built from source.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2, macOS 15…
    validations:
      required: true
  - type: input
    id: fusion
    attributes:
      label: Autodesk Fusion version
      description: Only if the problem involves the CAD connector.
  - type: textarea
    id: packs
    attributes:
      label: Packs installed
      description: Pack ids and versions, from Settings → Packs.
      placeholder: |
        robotica_base 0.1.4
        fusion 0.1.1
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project…
        2. Add the block…
        3. Run…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Error messages from the block or the backend output. Remove any personal data or API keys first.
      render: text
